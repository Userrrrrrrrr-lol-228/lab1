spring:
  application:
    name: 24049
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

jwt:
  secret: ${JWT_SECRET}
  access-ttl: 15m
  refresh-ttl: 7d
